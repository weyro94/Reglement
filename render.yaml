# Configuration Render (hébergement gratuit) — voir HEBERGEMENT-RENDER.md
services:
  - type: web
    name: overline-wiki
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
